services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: retrieval-lab-postgres
    environment:
      POSTGRES_USER: retrieval_lab
      POSTGRES_PASSWORD: retrieval_lab
      POSTGRES_DB: retrieval_lab
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./apps/api/docker/postgres/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U retrieval_lab -d retrieval_lab']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: retrieval-lab-redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:
